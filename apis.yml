name: Silicon Therapeutics
description: 'Silicon Therapeutics was a Boston-based biotechnology company that built
  an integrated, physics-based drug-discovery platform combining quantum mechanics,
  molecular simulation, and machine learning to design small-molecule medicines against
  historically intractable targets. Founded in 2015, it was acquired by Roivant Sciences
  in 2021 to form the basis of Roivant''s computational discovery engine; its former
  site (silicontx.com) now redirects to roivant.com. The company is a computational
  drug-discovery firm with no public API, developer platform, SDK, or technical documentation.'
